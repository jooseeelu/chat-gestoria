<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b1329" />
  <title>Sin conexión · Gestoría eMadrid</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0b1329;
      color: #e2e8f0;
      font-family: Inter, system-ui, -apple-system, sans-serif;
      text-align: center;
      padding: 16px;
    }
    img { width: 72px; height: 72px; border-radius: 16px; margin-bottom: 16px; }
    h1 { font-size: 18px; margin: 0 0 6px; }
    p { font-size: 14px; color: #94a3b8; margin: 0 0 20px; }
    button {
      background: #c59a3e;
      color: #fff;
      border: 0;
      border-radius: 12px;
      padding: 10px 18px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div>
    <img src="/icons/icon-192.png" alt="" />
    <h1>Sin conexión</h1>
    <p>No hay internet ahora mismo. El chat volverá en cuanto recuperes la conexión.</p>
    <button onclick="location.reload()">Reintentar</button>
  </div>
  <script>
    window.addEventListener('online', () => location.reload());
  </script>
</body>
</html>
