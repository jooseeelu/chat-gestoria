# IP real del cliente: delante está el Nginx del VPS (o Traefik), que la manda en
# X-Forwarded-For. Sin esto todos los usuarios parecerían la misma IP del proxy.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from 127.0.0.1;
real_ip_header X-Forwarded-For;

# Freno a ataques de fuerza bruta contra el login (usuarios y admin):
# 10 intentos por minuto y por IP, con una ráfaga de 5.
limit_req_zone $binary_remote_addr zone=pb_auth:10m rate=10r/m;

server {
    listen 80;
    server_name localhost;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Por defecto Nginx corta a 1 MB (error 413); el campo file admite hasta 100 MB
    client_max_body_size 100M;

    # Gzip compresión
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # La página de la app: sin caché (cada despliegue llega al momento) y con cabeceras
    # de seguridad. La CSP impide ejecutar scripts que no sean los de la propia app,
    # así un XSS no podría robar la sesión aunque alguien consiguiera inyectar HTML.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob:; connect-src 'self'; frame-src 'self' blob:; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    # Endpoints de login y recuperación con límite de intentos
    location ~ ^/api/(admins|collections/[^/]+)/(auth-with-password|request-password-reset|confirm-password-reset|request-verification|request-email-change)$ {
        limit_req zone=pb_auth burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://backend:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Tiempo real (SSE). X-Accel-Buffering le dice al Nginx del VPS que está
    # delante que no retenga la respuesta; si no, nunca llega PB_CONNECT.
    location /api/realtime {
        proxy_pass http://backend:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        gzip off;
        add_header X-Accel-Buffering no always;
        add_header Cache-Control no-cache always;
    }

    # Proxy para llamadas directas a PocketBase
    location /api/ {
        proxy_pass http://backend:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 360s;

        # WebSocket / SSE
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;

        # OBLIGATORIO para tiempo real simultáneo (SSE sin buffering)
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
    }

    location /_/ {
        proxy_pass http://backend:8090;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
