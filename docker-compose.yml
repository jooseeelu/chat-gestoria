services:
  # PocketBase Backend: Autenticación, Base de Datos, Storage y WebSockets/SSE
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "8090"
    volumes:
      - pb_data:/pb/pb_data
      - ./backend/pb_migrations:/pb/pb_migrations
      - ./backend/pb_hooks:/pb/pb_hooks:ro
    environment:
      - N8N_WEBHOOK_URL=${N8N_WEBHOOK_URL:-}
    networks:
      - gestoria_net

  # Envío de notificaciones Web Push (solo accesible desde la red interna)
  push:
    build:
      context: ./push
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "3000"
    volumes:
      - push_data:/data
    networks:
      - gestoria_net

  # Frontend Vue 3 + Vite servido con Nginx
  # Expuesto en 127.0.0.1:3080 (puerto 100% libre comprobado en el VPS)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_POCKETBASE_URL: ${VITE_POCKETBASE_URL:-}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3080:80"
    depends_on:
      - backend
    networks:
      - gestoria_net

volumes:
  pb_data:
    name: chat_gestoria_pb_data
  push_data:
    name: chat_gestoria_push_data

networks:
  gestoria_net:
    driver: bridge
