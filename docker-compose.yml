services:
  # PocketBase Backend: Autenticación, Base de Datos, Storage y WebSockets/SSE
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chat_gestoria_backend
    restart: unless-stopped
    expose:
      - "8090"
    volumes:
      - pb_data:/pb/pb_data
      - ./backend/pb_migrations:/pb/pb_migrations:ro
      - ./backend/pb_hooks:/pb/pb_hooks:ro
    environment:
      - PB_ENCRYPTION_KEY=
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8090/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - gestoria_net

  # Frontend Vue 3 + Vite servido con Nginx
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_POCKETBASE_URL: ${VITE_POCKETBASE_URL:-}
    container_name: chat_gestoria_frontend
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - gestoria_net

volumes:
  pb_data:
    name: chat_gestoria_pb_data

networks:
  gestoria_net:
    driver: bridge
